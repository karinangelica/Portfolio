<!DOCTYPE html>
<html lang="en">
<head>
    <title>ShopIn Footer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap');

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #1a2940;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #1a2940;
            color: white;
        }

        .footer .left {
            display: flex;
            align-items: center;
        }

        .footer .left img {
            max-height: 40px;
            margin-right: 10px;
        }

        .footer .center {
            text-align: center;
            flex-grow: 1;
        }

        .footer .center p {
            margin: 0;
        }

        .footer .right {
            text-align: right;
        }

        .footer .right a {
            color: white;
            font-size: 18px;
            margin: 0 10px;
            text-decoration: none;
        }

        .footer .right a:hover {
            color: #4CAF50;
        }

        .socmed {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: #1a2940;
        }

        .socmed a {
            color: white;
            font-size: 24px;
            margin: 0 15px;
            text-decoration: none;
        }

        .socmed a:hover {
            color: #4CAF50;
        }

        .marquee {
            background-color: #1a2940;
            color: white;
            padding: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="footer">
        <div class="left">
            <img src="https://cdn-icons-png.flaticon.com/128/15707/15707776.png" alt="Instagram">
            <img src="https://www.freepnglogos.com/uploads/twitter-x-logo-png/twitter-x-logo-png-9.png" alt="X">
            <img src="https://cdn-icons-png.flaticon.com/128/11376/11376367.png" alt="Gmail">
        </div>

        <div class="center">
            <p>&copy; 2024 Archipelore. All rights reserved.</p>
        </div>

        <div class="right">
            <a href="#">Login</a> | <a href="#">Sign Up</a>
        </div>
    </div>
</body>
</html>
