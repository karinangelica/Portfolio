<!DOCTYPE html>
<html>
<head>
    <title>ShopIn - Your Favorite Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

        .header {
            background-color: #1a2940;
            color: white;
            padding: 15px 0; 
            text-align: center;
            border-bottom: 3px solid #0f1d33;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        h4 {
            font-size: 20px;
            font-weight: 400;
        }

        .nav {
            margin-top: 10px; 
            text-align: center;
        }

        .buttonClass {
            display: inline-block;
            background-color: #003366;
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #0f1d33;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
        }

        .buttonClass:hover {
            background-color: #0f1d33;
            transform: translateY(-3px);
        }

        .buttonClass:active {
            transform: translateY(0);
        }

        marquee {
            font-size: 18px;
            font-weight: 600;
            color: #1a2940;
            margin: 10px 0; 
        }

        .content {
            padding: 10px; 
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        footer {
            background-color: #1a2940;
            color: #ddd;
            text-align: center;
            padding: 15px 0;
            margin-top: 30px;
            border-top: 3px solid #0f1d33;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Archipelore</h1>
    </div>
    
    <marquee behavior="alternate">Your #1 Online Shop. Discover Elegance and Cuteness here.</marquee>

    <div class="content">
        <div class="nav">
            <a href="home.html" class="buttonClass" target="content">Home</a>
            <a href="clothing.html" class="buttonClass" target="content">Clothing</a>
            <a href="figurines.html" class="buttonClass" target="content">Figurines</a>
            <a href="sneakers.html" class="buttonClass" target="content">Sneakers</a>
        </div>
    </div>

</body>
</html>
